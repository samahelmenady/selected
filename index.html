<script id="quizData" type="application/json">[{"id": 1, "title": "Lecture 1", "questions": [{"n": 2, "en": "During the Symbolic AI era (1950s–1980s), what was the fundamental belief regarding how artificial intelligence should be achieved?", "options": [{"en": "Intelligence can be achieved by manipulating symbols based on explicit rules.", "ar": "نحقق الذكاء بمعالجة الرموز حسب قواعد صريحة."}, {"en": "Intelligence emerges naturally by training neural networks on massive internet data.", "ar": "الذكاء بيظهر بتدريب شبكات عصبية على بيانات ضخمة من الإنترنت."}, {"en": "Language patterns should be learned statistically from n-gram probabilities.", "ar": "نتعلم أنماط اللغة إحصائيًا من احتمالات مجموعات الكلمات المتتالية."}, {"en": "Words must be converted into high-dimensional dense vector embeddings.", "ar": "نحوّل الكلمات لمتجهات كثيفة عالية الأبعاد."}], "correct": 0, "ar": "في عصر الذكاء الاصطناعي الرمزي من الخمسينيات للتمنينيات، إيه الفكرة الأساسية عن طريقة تحقيق الذكاء الاصطناعي؟"}, {"n": 3, "en": "According to the history timeline in Lecture 1, what was the primary limitation of Symbolic AI rule-based systems?", "options": [{"en": "They required high-performance GPUs to process symbols.", "ar": "احتاجت وحدات معالجة رسومية قوية لمعالجة الرموز."}, {"en": "They lacked word embedding vectors for sentence generation.", "ar": "افتقرت لمتجهات الكلمات لتوليد الجمل."}, {"en": "They were brittle and could not handle the ambiguity and messiness of real human language.", "ar": "كانت هشة ومابتتعاملش كويس مع غموض اللغة البشرية وعدم انتظامها."}, {"en": "They could only perform zero-shot tasks without training data.", "ar": "كانت بتنفّذ مهام من غير أمثلة ومن غير بيانات تدريب بس."}], "correct": 2, "ar": "إيه العيب الأساسي لأنظمة الذكاء الاصطناعي الرمزي المعتمدة على القواعد؟"}, {"n": 4, "en": "What core shift in philosophy marked the transition to Statistical NLP (1990s–2010s)?", "options": [{"en": "Replacing neural networks with rule-based grammar checkers.", "ar": "استبدال الشبكات ال gs capture semantic meaning. Which equation is explicitly shown in the slides?", "options": [{"en": "king + man − woman ≈ queen", "ar": "ملك + رجل − امرأة ≈ ملكة."}, {"en": "queen + king − man ≈ woman", "ar": "ملكة + ملك − رجل ≈ امرأة."}, {"en": "king − man + woman ≈ queen", "ar": "ملك − رجل + امرأة ≈ ملكة."}, {"en": "man − king + queen ≈ woman", "ar": "رجل − ملك + ملكة ≈ امرأة."}], "correct": 2, "ar": "أنهي معادلة ظهرت في السلايدات لتوضيح علاقات المعنى بين متجهات الكلمات؟"}, {"n": 8, "en": "Which neural network architectures were predominantly used to process sequential word inputs during the early deep learning NLP era?", "options": [{"en": "Convolutional Neural Networks (CNNs) and Support Vector Machines", "ar": "الشبكات الالتفافية وآلات المتجهات الداعمة."}, {"en": "Decision Trees and Random Forests", "ar": "أشجار القرار والغابات العشوائية."}, {"en": "Feedforward Perceptrons and Naive Bayes Classifiers", "ar": "بيرسيبترون بتغذية أمامية ومصنّفات بايز الساذج."}, {"en": "Recurrent Neural Networks (RNNs) and LSTMs", "ar": "الشبكات العصبية التكرارية وشبكات الذاكرة الطويلة قصيرة المدى."}], "correct": 3, "ar": "أنهي معماريات استخدمت لمعالجة الكلمات بالتسلسل في بدايات التعلّم العميق للغة؟"}, {"n": 9, "en": "What major limitation associated with RNNs and LSTMs is highlighted in the history section of the lecture?", "options": [{"en": "Processing long text sequences was slow and difficult (the \"bottleneck\" problem).", "ar": "معالجة النصوص الطويلة كانت بطيئة وصعبة، ودي مشكلة عنق الزجاجة."}, {"en": "They could only process text using explicit symbolic rules.", "ar": "عالجت النصوص بقواعد رمزية صريحة بس."}, {"en": "They were incapable of capturing word meanings using vectors.", "ar": "ماقدرتش تمثّل معاني الكلمات بمتجهات."}, {"en": "They required human feedback alignment (RLHF) to function.", "ar": "احتاجت مواءمة بتغذية راجعة بشرية عشان تشتغل."}], "correct": 0, "ar": "إيه العيب المهم في الشبكات التكرارية وشبكات الذاكرة الطويلة قصيرة المدى؟"}, {"n": 10, "en": "At its simple core, what is a Language Model defined as in Lecture 1?", "options": [{"en": "A deterministic logic solver that executes written C++ algorithms.", "ar": "نظام منطقي حتمي بينفّذ خوارزميات سي بلس بلس."}, {"en": "A probability machine whose core job is predicting the most likely next word given a text sequence.", "ar": "نظام احتمالي بيتوقّع الكلمة التالية الأكثر احتمالًا من النص السابق."}, {"en": "A database indexing tool for parsing structured SQL tables.", "ar": "أداة فهرسة قواعد بيانات بتحلّل جداول إس كيو إل."}, {"en": "A rule-based grammar validator that flags syntax errors.", "ar": "مدقّق نحوي قائم على القواعد بيحدّد أخطاء التركيب."}], "correct": 1, "ar": "إيه أبسط تعريف لنموذج اللغة في المحاضرة الأولى؟"}, {"n": 11, "en": "In the next-word prediction example \"The student opened their…\", which word had the highest predicted probability according to the slide diagram?", "options": [{"en": "mind (5%)", "ar": "عقله، 5٪."}, {"en": "laptop (30%)", "ar": "اللابتوب بتاعه، 30٪."}, {"en": "book (40%)", "ar": "كتابه، 40٪."}, {"en": "refrigerator (0.001%)", "ar": "التلاجة، 0.001٪."}], "correct": 2, "ar": "في مثال «الطالب فتح الـ…»، أنهي كلمة كان ليها أعلى احتمال؟"}, {"n": 12, "en": "In the same next-word prediction example (\"The student opened their…\"), what probability did the model assign to the word \"refrigerator\"?", "options": [{"en": "40%", "ar": "40٪."}, {"en": "30%", "ar": "30٪."}, {"en": "5%", "ar": "5٪."}, {"en": "0.001%", "ar": "0.001٪."}], "correct": 3, "ar": "في نفس مثال توقّع الكلمة التالية، احتمال كلمة «التلاجة» كان كام؟"}, {"n": 13, "en": "Which of the \"Three Pillars of Scale\" represents the model's \"Brain Size\", consisting of billions or trillions of weights and biases?", "options": [{"en": "Parameters", "ar": "المعاملات."}, {"en": "Data", "ar": "البيانات."}, {"en": "Compute", "ar": "القدرة الحاسوبية."}, {"en": "Architecture", "ar": "المعمارية."}], "correct": 0, "ar": "أنهي ركيزة من ركائز التوسّع بتمثّل حجم عقل الموديل من مليارات أو تريليونات الأوزان والانحيازات؟"}, {"n": 14, "en": "The lecture compares the \"Data\" pillar of scale to which of the following analogies?", "options": [{"en": "The number of synapses in a biological human brain", "ar": "عدد الوصلات العصبية في المخ البشري."}, {"en": "All the books a person could read in thousands of lifetimes", "ar": "كل الكتب اللي شخص ممكن يقراها خلال آلاف الأعمار."}, {"en": "The energy required to power a small city", "ar": "الطاقة اللازمة لتشغيل مدينة صغيرة."}, {"en": "A rule-based dictionary of symbolic definitions", "ar": "قاموس تعريفات رمزية قائم على القواعد."}], "correct": 1, "ar": "المحاضرة شبّهت ركيزة البيانات بإيه؟"}, {"n": 15, "en": "According to the slides, what constitutes the \"Compute\" pillar (the model's engine)?", "options": [{"en": "Millions of hand-crafted grammar rules compiled over decades", "ar": "ملايين القواعد النحوية المكتوبة يدويًا عبر عقود."}, {"en": "Terabytes of static text files stored on hard drives", "ar": "تيرابايتات من النصوص الثابتة على أقراص صلبة."}, {"en": "Thousands of specialized chips (GPUs/TPUs) running for months", "ar": "آلاف الشرائح المتخصصة زي وحدات المعالجة الرسومية بتشتغل لشهور."}, {"en": "High-dimensional vector tables generated by Word2Vec", "ar": "جداول متجهات عالية الأبعاد مولّدة بوورد تو فيك."}], "correct": 2, "ar": "إيه اللي بيكوّن ركيزة القدرة الحاسوبية، محرّك الموديل؟"}, {"n": 16, "en": "In the discussion of scale examples, which model is explicitly referenced in the lecture for having a 1M token context window?", "options": [{"en": "GPT-5", "ar": "جي بي تي 5."}, {"en": "Word2Vec", "ar": "وورد تو فيك."}, {"en": "Sequoia-10x", "ar": "سيكويا 10 إكس."}, {"en": "Gemini 2.5 Pro", "ar": "جيميني 2.5 برو."}], "correct": 3, "ar": "أنهي موديل اتذكر إن نافذة السياق بتاعته مليون توكن؟"}, {"n": 17, "en": "According to the comparison table in Lecture 1, how does the logic of traditional software compare to that of Large Language Models?", "options": [{"en": "Traditional software relies on programmed explicit rules, whereas LLMs rely on learned emergent patterns.", "ar": "التقليدية بتستخدم قواعد مبرمجة صريحة، واللغوية بتستخدم أنماط ناشئة متعلَّمة."}, {"en": "Traditional software is general and flexible, whereas LLMs are narrow and specific.", "ar": "التقليدية عامة ومرنة، واللغوية محدودة ومتخصصة."}, {"en": "Traditional software is trained on data, whereas LLMs are written manually in C++ or Java.", "ar": "التقليدية بتتدرّب على البيانات، واللغوية بتتكتب يدويًا بسي بلس بلس أو جافا."}, {"en": "Traditional software processes natural language, whereas LLMs require structured tabular data.", "ar": "التقليدية بتعالج اللغة الطبيعية، واللغوية بتحتاج جداول منظمة."}], "correct": 0, "ar": "إيه الفرق بين منطق البرامج التقليدية ومنطق النماذج اللغوية الكبيرة؟"}, {"n": 18, "en": "Based on the LLMs vs. Traditional Software table, what is the primary development approach for Large Language Models?", "options": [{"en": "Hand-coding rules in C++ or Java", "ar": "كتابة القواعد يدويًا بسي بلس بلس أو جافا."}, {"en": "Training on vast amounts of data", "ar": "التدريب على كميات ضخمة من البيانات."}, {"en": "Writing explicit grammar conditions", "ar": "كتابة شروط نحوية صريحة."}, {"en": "Compiling decision tree logic manually", "ar": "تجميع منطق أشجار القرار يدويًا."}], "correct": 1, "ar": "إيه الطريقة الأساسية لتطوير النماذج اللغوية الكبيرة؟"}, {"n": 19, "en": "How do input types differ between Traditional Software and LLMs according to the lecture comparison?", "options": [{"en": "Traditional software takes unstructured video, while LLMs take binary code.", "ar": "التقليدية بتاخد فيديو غير منظّم، واللغوية بتاخد كود ثنائي."}, {"en": "Traditional software takes natural language prompts, while LLMs take SQL tables.", "ar": "التقليدية بتاخد طلبات بلغة طبيعية، واللغوية بتاخد جداول إس كيو إل."}, {"en": "Traditional software takes structured data, while LLMs take natural language.", "ar": "التقليدية بتاخد بيانات منظمة، واللغوية بتاخد لغة طبيعية."}, {"en": "Both traditional software and LLMs exclusively take structured database tables.", "ar": "الاتنين بياخدوا جداول قواعد بيانات منظمة بس."}], "correct": 2, "ar": "إيه الفرق بين مدخلات البرامج التقليدية والنماذج اللغوية الكبيرة حسب المحاضرة؟"}, {"n": 20, "en": "How is \"Zero-Shot Learning\" defined in the emergence section of the slides?", "options": [{"en": "Training a language model from scratch with zero parameters.", "ar": "تدريب نموذج لغة من الصفر من غير معاملات."}, {"en": "Fine-tuning a model using RLHF without human labelers.", "ar": "ضبط الموديل بالتغذية الراجعة البشرية من غير موسّمين بشريين."}, {"en": "Providing thousands of labelled examples inside the prompt before asking for an answer.", "ar": "تقديم آلاف الأمثلة الموسومة داخل الطلب."}, {"en": "Asking the model to perform a task it was never explicitly trained to do, without giving it any examples.", "ar": "نطلب مهمة الموديل ماتدرّبش عليها بشكل صريح ومن غير ما نقدّم أمثلة."}], "correct": 3, "ar": "إيه تعريف التعلّم من غير أمثلة في السلايدات؟"}, {"n": 21, "en": "In the Zero-Shot sentiment analysis demonstration, what output did the model return for the review: \"I wasn't sure at first, but this film was surprisingly brilliant and heartwarming!\" ?", "options": [{"en": "Positive", "ar": "إيجابي."}, {"en": "Negative", "ar": "سلبي."}, {"en": "Neutral", "ar": "محايد."}, {"en": "Mixed", "ar": "مختلط."}], "correct": 0, "ar": "في تحليل المشاعر من غير أمثلة، إيه ناتج مراجعة «ماكنتش متأكد في الأول، بس الفيلم كان رائع ومؤثر بشكل فاجأني»؟"}, {"n": 22, "en": "What is the definition of \"Few-Shot Learning\" given in Lecture 1?", "options": [{"en": "Training a small model on a few megabytes of code.", "ar": "تدريب موديل صغير على ميجابايتات قليلة من الكود."}, {"en": "Guiding the model by providing a few examples of the task within the prompt itself.", "ar": "توجيه الموديل بشوية أمثلة للمهمة داخل الطلب نفسه."}, {"en": "Updating model parameters using a few epochs of gradient descent.", "ar": "تحديث المعاملات بعدد قليل من دورات النزول التدريجي."}, {"en": "Running a model on a few GPU chips for inference.", "ar": "تشغيل الموديل على عدد قليل من وحدات المعالجة الرسومية للاستدلال."}], "correct": 1, "ar": "إيه تعريف التعلّم بأمثلة قليلة؟"}, {"n": 23, "en": "In the Few-Shot information extraction example, what was the target LLM output for the prompt ending with \"Text: Cairo is the capital of the country of Egypt. Name:\" ?", "options": [{"en": "Cairo, Capital: Egypt", "ar": "القاهرة، العاصمة: مصر."}, {"en": "Country: Egypt, City: Cairo", "ar": "الدولة: مصر، المدينة: القاهرة."}, {"en": "Egypt, Capital: Cairo", "ar": "مصر، العاصمة: القاهرة."}, {"en": "Name: Egypt, Country: Cairo", "ar": "الاسم: مصر، الدولة: القاهرة."}], "correct": 2, "ar": "في مثال استخراج المعلومات، إيه الناتج المطلوب بعد «القاهرة هي عاصمة دولة مصر. الاسم:»؟"}, {"n": 24, "en": "Consider the Python code snippet shown in the lecture for checking palindromes:\n\ndef is_palindrome(s):\n    s = s.lower().replace(\" \", \"\")\n    return s == s[::-1]\n\nWhat does the slice operation s[::-1] do in this function?", "options": [{"en": "Converts the string into uppercase letters.", "ar": "بتحوّل النص لحروف كبيرة."}, {"en": "Removes all whitespace characters from the string.", "ar": "بتحذف كل محارف المسافات البيضاء."}, {"en": "Reverses the string s.", "ar": "بتعكس ترتيب حروف النص."}, {"en": "Replaces punctuation with empty spaces.", "ar": "بتستبدل علامات الترقيم بمسافات."}], "correct": 2, "ar": "في دالة بايثون لفحص النص المتناظر، عملية s[::-1] بتعمل إيه؟"}, {"n": 25, "en": "In the Chain-of-Thought reasoning showcase, the model solves: \"Roger has 5 tennis balls. He buys 2 more cans of tennis balls. Each can has 3 tennis balls. How many tennis balls does he have now?\" How does the model derive the final answer?", "options": [{"en": "By showing its work step-by-step: 2 cans × 3 balls = 6, then 5 + 6 = 11.", "ar": "خطوة بخطوة، 2 × 3 = 6، وبعدها 5 + 6 = 11."}, {"en": "By looking up the word \"tennis\" in a rule-based dictionary.", "ar": "بيدوّر على كلمة تنس في قاموس قائم على القواعد."}, {"en": "By executing a C++ program compiled during pre-training.", "ar": "بينفّذ برنامج سي بلس بلس اتجمّع أثناء التدريب المسبق."}, {"en": "By generating a poem about tennis balls in Cairo.", "ar": "بيولّد قصيدة عن كور التنس في القاهرة."}], "correct": 0, "ar": "روجر معاه 5 كور واشترى علبتين، كل علبة فيها 3 كور. إزاي الموديل بيحل المسألة في مثال سلسلة التفكير؟"}, {"n": 26, "en": "In the summarization showcase example, what is the primary goal demonstrated when processing a scientific abstract?", "options": [{"en": "Outputting a 10-page detailed technical breakdown with mathematical equations.", "ar": "إخراج شرح تقني من 10 صفحات فيه معادلات."}, {"en": "Translating a complex abstract into a single simplified sentence for a layperson.", "ar": "تحويل الملخص المعقّد لجملة مبسطة واحدة لغير المتخصص."}, {"en": "Converting structured JSON metadata into raw C++ code.", "ar": "تحويل بيانات جيسون الوصفية لكود سي بلس بلس."}, {"en": "Generating a multi-shot prompt with three distinct grammar rules.", "ar": "توليد طلب بأمثلة متعددة وتلات قواعد نحوية."}], "correct": 1, "ar": "إيه هدف مثال تلخيص ملخص البحث العلمي؟"}, {"n": 27, "en": "In \"The Hook: A Tale of Two Bots\", how did the 2010s Chatbot react to the multi-intent query asking about weather and lunch in Cairo?", "options": [{"en": "It answered both requests thoroughly with outdoor seating recommendations.", "ar": "جاوب الطلبين بالتفصيل ورشّح قعدات في الهوا."}, {"en": "It generated a romantic poem about Cairo at dawn.", "ar": "كتب قصيدة رومانسية عن القاهرة وقت الفجر."}, {"en": "It failed, stating: \"I can only process one request at a time. Please ask about weather or restaurants.\"", "ar": "فشل وقال إنه بيعالج طلب واحد في المرة، وطلب السؤال عن الجو أو المطاعم."}, {"en": "It extracted structured JSON parameters and executed a SQL query.", "ar": "استخرج معاملات جيسون ونفّذ استعلام إس كيو إل."}], "correct": 2, "ar": "في «حكاية بوتين»، إزاي شات بوت عقد 2010 ردّ على طلب الجو والغدا في القاهرة مع بعض؟"}]}, {"id": 2, "title": "Lecture 2", "questions": [{"n": 1, "en": "What is the primary core question addressed in Lecture 2?", "options": [{"en": "How do we build autonomous AI agents using reinforcement learning?", "ar": "إزاي نبني وكلاء ذكاء اصطناعي مستقلين بالتعلّم المعزّز؟"}, {"en": "How do we turn words into numbers that a machine can actually understand and learn from?", "ar": "إزاي نحول الكلمات لأرقام الآلة تفهمها وتتعلم منها؟"}, {"en": "How do we write manual C++ rules for parsing natural language syntax?", "ar": "إزاي نكتب قواعد يدويًا بسي بلس بلس لتحليل اللغة؟"}, {"en": "How do we fine-tune large models using Human Feedback Alignment (RLHF)?", "ar": "إزاي نضبط الموديلات الكبيرة بتغذية راجعة بشرية؟"}], "correct": 1, "ar": "إيه السؤال الأساسي اللي بتجاوب عليه المحاضرة التانية؟"}, {"n": 2, "en": "In a vocabulary of 50,000 unique words, how does One-Hot Encoding represent each word?", "options": [{"en": "As a 50,000-dimensional vector containing all zeros except a single '1' at the word's index.", "ar": "متجه من 50,000 بُعد، كله أصفار إلا 1 عند موضع الكلمة."}, {"en": "As a 300-dimensional dense vector of continuous floating-point numbers.", "ar": "متجه كثيف من 300 بُعد بقيم فاصلة عائمة مستمرة."}, {"en": "As a single scalar integer representing word frequency in a corpus.", "ar": "عدد صحيح واحد بيمثّل تكرار الكلمة."}, {"en": "As a matrix containing word co-occurrence probabilities.", "ar": "مصفوفة احتمالات ظهور الكلمات مع بعض."}], "correct": 0, "ar": "في قاموس من 50,000 كلمة، إزاي ترميز وان هوت بيمثّل الكلمة؟"}, {"n": 3, "en": "Which major limitation of One-Hot Encoding refers to the fact that vectors are huge and contain mostly zero values?", "options": [{"en": "Orthogonality", "ar": "التعامد."}, {"en": "Sequential Bottleneck", "ar": "عنق زجاجة المعالجة التسلسلية."}, {"en": "Vanishing Gradient", "ar": "تلاشي التدرّج."}, {"en": "Sparsity", "ar": "التخلخل، يعني معظم القيم أصفار."}], "correct": 3, "ar": "إيه اسم عيب وان هوت اللي معناه إن المتجهات ضخمة ومعظمها أصفار؟"}, {"n": 4, "en": "Why are the One-Hot vectors for \"cat\" and \"dog\" considered mathematically unrelated in vector space?", "options": [{"en": "Because their vector dimensions change dynamically with sentence length.", "ar": "أبعادهم بتتغير حسب طول الجملة."}, {"en": "Because they share non-zero values across multiple vector indices.", "ar": "بيشتركوا في قيم غير صفرية في خانات متعددة."}, {"en": "Because their dot product is zero and the angle between them is 90 degrees.", "ar": "الضرب النقطي بينهم صفر والزاوية 90 درجة."}, {"en": "Because they are processed using recurrent hidden loops.", "ar": "بيتعالجوا بحلقات مخفية تكرارية."}], "correct": 2, "ar": "ليه متجهي وان هوت لكلمتي قطة وكلب مالهمش علاقة رياضيًا؟"}, {"n": 5, "en": "What is the primary consequence of orthogonality in One-Hot word representations?", "options": [{"en": "The model has no built-in sense of word similarity and must learn every relationship from scratch.", "ar": "الموديل معندوش معرفة مدمجة بتشابه الكلمات ولازم يتعلم العلاقات من الصفر."}, {"en": "Vectors automatically cluster words with similar meanings together.", "ar": "المتجهات بتجمّع المعاني المتشابهة تلقائيًا."}, {"en": "Word vectors can be added and subtracted to perform semantic arithmetic.", "ar": "نقدر نجمع ونطرح المتجهات لتمثيل علاقات المعنى."}, {"en": "Sentence word order is preserved automatically during processing.", "ar": "ترتيب الكلمات بيتحفظ تلقائيًا."}], "correct": 0, "ar": "إيه النتيجة الأساسية لتعامد متجهات وان هوت؟"}, {"n": 6, "en": "How do Word Embeddings overcome the limitations of One-Hot Encoding?", "options": [{"en": "By expanding vector size from 50,000 to 1,000,000 dimensions.", "ar": "بزيادة الأبعاد من 50,000 لمليون."}, {"en": "By replacing numerical representations with hand-written linguistic rules.", "ar": "باستبدال الأرقام بقواعد لغوية يدوية."}, {"en": "By eliminating the need to process word context during training.", "ar": "بإلغاء الحاجة لسياق الكلمة في التدريب."}, {"en": "By representing each word as a short, dense vector (e.g., 300 dimensions).", "ar": "بتمثيل الكلمة بمتجه قصير وكثيف، زي 300 بُعد."}], "correct": 3, "ar": "إزاي تمثيلات الكلمات بتتغلب على عيوب وان هوت؟"}, {"n": 7, "en": "What is the foundational principle behind training models like Word2Vec and GloVe?", "options": [{"en": "A word's meaning is strictly determined by its length and spelling.", "ar": "المعنى بيتحدد بطول الكلمة وتهجئتها بس."}, {"en": "Word vectors must be manually constructed by domain experts.", "ar": "خبراء المجال لازم يبنوا المتجهات يدويًا."}, {"en": "A word's meaning can be captured by its context—the words that tend to appear around it.", "ar": "معنى الكلمة بيتفهم من سياقها والكلمات اللي بتظهر حواليها."}, {"en": "Words are assigned vectors based solely on their frequency in a dictionary.", "ar": "المتجهات بتتحدد بتكرار الكلمة في القاموس بس."}], "correct": 2, "ar": "إيه المبدأ الأساسي لتدريب وورد تو فيك وجلوف؟"}, {"n": 8, "en": "In a visualized embedding space, what does spatial proximity between word vectors signify?", "options": [{"en": "The alphabetical order of words in the vocabulary.", "ar": "الترتيب الأبجدي."}, {"en": "Semantic similarity, where words with similar meanings cluster together.", "ar": "تشابه المعنى، فالكلمات المتشابهة بتتجمّع."}, {"en": "The computational time required to process each word.", "ar": "وقت الحوسبة اللازم للكلمة."}, {"en": "The exact sentence position where words appear in a text.", "ar": "مكان الكلمة بالضبط في الجملة."}], "correct": 1, "ar": "قرب متجهات الكلمات من بعض في الرسم بيدل على إيه؟"}, {"n": 9, "en": "In the 2D embedding space visualization presented in Lecture 2, which cluster includes the words \"Cairo\", \"Giza\", \"Mansoura\", and \"Alexandria\"?", "options": [{"en": "Literature", "ar": "الأدب."}, {"en": "Animals", "ar": "الحيوانات."}, {"en": "Sequential Models", "ar": "الموديلات التسلسلية."}, {"en": "Egyptian Cities", "ar": "المدن المصرية."}], "correct": 3, "ar": "القاهرة والجيزة والمنصورة والإسكندرية بينتموا لأنهي مجموعة في الرسم؟"}, {"n": 10, "en": "According to the vector arithmetic examples in Lecture 2, which equation demonstrates that embeddings capture semantic relationships?", "options": [{"en": "vector('king') + vector('man') − vector('woman') ≈ vector('queen')", "ar": "متجه ملك + متجه رجل − متجه امرأة ≈ متجه ملكة."}, {"en": "vector('king') − vector('man') + vector('woman') ≈ vector('queen')", "ar": "متجه ملك − متجه رجل + متجه امرأة ≈ متجه ملكة."}, {"en": "vector('queen') + vector('king') − vector('man') ≈ vector('woman')", "ar": "متجه ملكة + متجه ملك − متجه رجل ≈ متجه امرأة."}, {"en": "vector('man') − vector('king') + vector('woman') ≈ vector('queen')", "ar": "متجه رجل − متجه ملك + متجه امرأة ≈ متجه ملكة."}], "correct": 1, "ar": "أنهي معادلة بتوضح إن المتجهات بتمثّل علاقات المعنى؟"}, {"n": 11, "en": "When calculating vector('Paris') − vector('France') + vector('Egypt'), what word vector is produced, and what relationship does it encode?", "options": [{"en": "vector('Cairo'), encoding the capital city relationship.", "ar": "متجه القاهرة، علاقة العاصمة بالدولة."}, {"en": "vector('Giza'), encoding the geographical distance relationship.", "ar": "متجه الجيزة، علاقة المسافة الجغرافية."}, {"en": "vector('Nile'), encoding the landmark river relationship.", "ar": "متجه النيل، علاقة النهر البارز بالمكان."}, {"en": "vector('Alexandria'), encoding the port city relationship.", "ar": "متجه الإسكندرية، علاقة مدينة الميناء."}], "correct": 0, "ar": "ناتج متجه باريس − متجه فرنسا + متجه مصر إيه، وبيمثّل أنهي علاقة؟"}, {"n": 12, "en": "Why does a simple \"bag of words\" approach using word embeddings fail to understand complete sentences?", "options": [{"en": "It converts dense 300-dimensional vectors back into sparse vectors.", "ar": "بترجّع المتجهات الكثيفة لمتجهات معظمها أصفار."}, {"en": "It cannot compute vector sums across multiple words.", "ar": "مابتقدرش تجمع متجهات كلمات متعددة."}, {"en": "It loses word order, treating \"The cat chased the dog\" and \"The dog chased the cat\" as identical.", "ar": "بتفقد الترتيب فبتساوي بين القطة طاردت الكلب والكلب طارد القطة."}, {"en": "It relies entirely on explicit C++ rule engines.", "ar": "بتعتمد بالكامل على محرّكات قواعد بسي بلس بلس."}], "correct": 2, "ar": "ليه حقيبة الكلمات باستخدام المتجهات مابتفهمش الجمل الكاملة؟"}, {"n": 13, "en": "What is a Recurrent Neural Network (RNN) as defined in Lecture 2?", "options": [{"en": "A model that processes all words in a sentence simultaneously in parallel.", "ar": "موديل بيعالج كل كلمات الجملة بالتوازي."}, {"en": "A lookup table that stores pre-calculated dot products between word pairs.", "ar": "جدول بيخزّن نواتج ضرب نقطي محسوبة مسبقًا."}, {"en": "A rule-based parser that evaluates text using decision trees.", "ar": "محلّل قواعد بيستخدم أشجار قرار."}, {"en": "A neural network with a loop that processes sequences one element at a time, passing a hidden state from step to step.", "ar": "شبكة بحلقة بتعالج عنصر كل مرة وتنقل حالة مخفية بين الخطوات."}], "correct": 3, "ar": "إيه تعريف الشبكة العصبية التكرارية؟"}, {"n": 14, "en": "What is the primary function of the \"hidden state\" in a Recurrent Neural Network?", "options": [{"en": "It acts as a form of memory that passes information and context from one step to the next.", "ar": "ذاكرة بتنقل المعلومات والسياق من خطوة للتانية."}, {"en": "It converts dense word embeddings into 50,000-dimensional sparse vectors.", "ar": "بتحوّل المتجهات الكثيفة لمتجهات من 50,000 بُعد معظمها أصفار."}, {"en": "It ensures that all word vectors remain completely orthogonal with a zero dot product.", "ar": "بتضمن التعامد والضرب النقطي الصفري."}, {"en": "It enables fully parallel training across thousands of GPU cores.", "ar": "بتسمح بتدريب متوازٍ بالكامل على آلاف الأنوية."}], "correct": 0, "ar": "إيه الوظيفة الأساسية للحالة المخفية؟"}, {"n": 15, "en": "When an RNN reads the sentence \"The cat sat on the mat.\", how is the hidden state h_2 generated at the second word (\"cat\")?", "options": [{"en": "By processing only the word embedding of \"cat\" without any previous context.", "ar": "باستخدام متجه قطة لوحده من غير سياق."}, {"en": "By averaging the embeddings of all words in the sentence simultaneously.", "ar": "بمتوسط متجهات كل كلمات الجملة في نفس الوقت."}, {"en": "By taking the embedding for \"cat\" AND the previous hidden state h_1.", "ar": "باستخدام متجه قطة والحالة المخفية السابقة h_1."}, {"en": "By passing the final hidden state h_{\\text{final}} backwards through the network.", "ar": "بتمرير الحالة النهائية للخلف في الشبكة."}], "correct": 2, "ar": "عند قراءة «The cat sat on the mat»، إزاي بتتكوّن h_2 عند كلمة cat؟"}, {"n": 16, "en": "After an RNN processes all words in a sequence, what does the final hidden state ($h_{{final}}$) contain?", "options": [{"en": "Only the vector representation of the first word in the sentence.", "ar": "تمثيل أول كلمة بس."}, {"en": "A summary of the entire sentence processed up to that point.", "ar": "ملخص للجملة اللي اتعالجت لحد النقطة دي."}, {"en": "A list of grammar errors found in the text.", "ar": "قائمة بالأخطاء النحوية."}, {"en": "The gradient values used to reset the model's parameters.", "ar": "قيم التدرّج لإعادة ضبط المعاملات."}], "correct": 1, "ar": "إيه اللي بتحتويه الحالة المخفية النهائية بعد معالجة التسلسل؟"}, {"n": 17, "en": "What core problem prevents basic RNNs from effectively retaining long-term dependencies across long text sequences?", "options": [{"en": "Orthogonality of dense vectors", "ar": "تعامد المتجهات الكثيفة."}, {"en": "High sparsity in embedding matrices", "ar": "كثرة الأصفار في مصفوفات التمثيل."}, {"en": "Over-parallelization of hidden layers", "ar": "الإفراط في موازاة الطبقات المخفية."}, {"en": "The vanishing gradient problem", "ar": "مشكلة تلاشي التدرّج."}], "correct": 3, "ar": "إيه المشكلة اللي بتمنع الشبكات التكرارية البسيطة من الاحتفاظ بالعلاقات البعيدة؟"}, {"n": 18, "en": "In the example sentence \"I grew up in France... [many sentences later] ...so I speak fluent ______\", why does a basic RNN struggle to fill in \"French\"?", "options": [{"en": "The signal/gradient from \"France\" weakens significantly as it is backpropagated through many time steps.", "ar": "إشارة أو تدرّج فرنسا بيضعف عبر خطوات زمنية كتير أثناء الانتشار العكسي."}, {"en": "The word \"France\" is represented as a sparse vector with a zero dot product.", "ar": "فرنسا متمثلة بمتجه معظم قيمه أصفار وضرب نقطي صفري."}, {"en": "The model automatically deletes proper nouns from its memory cell.", "ar": "الموديل بيحذف أسماء العلم تلقائيًا."}, {"en": "Basic RNNs cannot process sentence sequences longer than 3 words.", "ar": "الشبكات البسيطة مابتعالجش أكتر من 3 كلمات."}], "correct": 0, "ar": "في «اتربّيت في فرنسا… وبعد جمل كتير… بتكلم … بطلاقة»، ليه الشبكة البسيطة بتتعثر في توقّع فرنساوي؟"}, {"n": 19, "en": "Which real-world analogy is used in Lecture 2 to explain how information fades in a simple RNN over long sequences?", "options": [{"en": "A smart conveyor belt with selective gates", "ar": "سير ناقل ذكي ببوابات انتقائية."}, {"en": "Reading a book all at once in parallel", "ar": "قراءة الكتاب كله بالتوازي."}, {"en": "The Whisper Game, where a message gets garbled or lost by the end of the line", "ar": "لعبة الهمس اللي الرسالة فيها بتتشوّه أو تضيع في آخر الصف."}, {"en": "A dictionary indexing system", "ar": "نظام فهرسة قاموس."}], "correct": 2, "ar": "إيه التشبيه المستخدم لضعف المعلومة في الشبكات التكرارية البسيطة؟"}, {"n": 20, "en": "What was Long Short-Term Memory (LSTM) specifically designed to solve?", "options": [{"en": "The inability of Word2Vec to generate dense embeddings.", "ar": "عجز وورد تو فيك عن توليد تمثيلات كثيفة."}, {"en": "The vanishing gradient problem in simple RNNs to handle long-term dependencies.", "ar": "تلاشي التدرّج في الشبكات البسيطة للتعامل مع العلاقات بعيدة المدى."}, {"en": "The slow speed of parallel processing on GPUs.", "ar": "بطء المعالجة المتوازية على وحدات المعالجة الرسومية."}, {"en": "The loss of vocabulary size during one-hot encoding.", "ar": "فقدان حجم القاموس أثناء ترميز وان هوت."}], "correct": 1, "ar": "شبكات الذاكرة الطويلة قصيرة المدى اتصمّمت عشان تحل إيه؟"}, {"n": 21, "en": "What is the specific responsibility of the Forget Gate in an LSTM cell?", "options": [{"en": "Deciding what information to throw away from the memory.", "ar": "تحديد المعلومات اللي تتشال من الذاكرة."}, {"en": "Deciding what new information to store in the memory.", "ar": "تحديد المعلومات الجديدة اللي تتخزّن."}, {"en": "Deciding what output to generate based on the current memory.", "ar": "تحديد الناتج حسب الذاكرة الحالية."}, {"en": "Calculating the dot product between incoming word vectors.", "ar": "حساب الضرب النقطي بين المتجهات الداخلة."}], "correct": 0, "ar": "إيه مسؤولية بوابة النسيان؟"}, {"n": 22, "en": "Which gate in an LSTM cell decides what new information should be stored in the cell's memory?", "options": [{"en": "Output Gate", "ar": "بوابة الإخراج."}, {"en": "Forget Gate", "ar": "بوابة النسيان."}, {"en": "Input Gate", "ar": "بوابة الإدخال."}, {"en": "Recurrent Gate", "ar": "البوابة التكرارية."}], "correct": 2, "ar": "أنهي بوابة بتحدد المعلومات الجديدة اللي تتخزّن في الذاكرة؟"}, {"n": 23, "en": "What is the function of the Output Gate in an LSTM cell?", "options": [{"en": "It erases the entire hidden state history.", "ar": "تمسح تاريخ الحالة المخفية كله."}, {"en": "It converts input text into 50,000-dimensional sparse vectors.", "ar": "تحوّل النص لمتجهات من 50,000 بُعد معظمها أصفار."}, {"en": "It determines which words to remove from the vocabulary.", "ar": "تحدد الكلمات اللي تتشال من القاموس."}, {"en": "It decides what to output based on the cell's memory.", "ar": "تحدد إيه اللي يطلع بناءً على ذاكرة الخلية."}], "correct": 3, "ar": "إيه وظيفة بوابة الإخراج؟"}, {"n": 24, "en": "How is the Gated Recurrent Unit (GRU) characterized in Lecture 2 compared to the LSTM?", "options": [{"en": "As a slower, more complex architecture with four additional gates.", "ar": "أبطأ وأعقد وفيها أربع بوابات إضافية."}, {"en": "As a simpler, faster version of the LSTM that often performs just as well.", "ar": "أبسط وأسرع وغالبًا بنفس مستوى الأداء."}, {"en": "As an un-gated network that suffers from worse vanishing gradients.", "ar": "شبكة من غير بوابات وتلاشي التدرّج فيها أسوأ."}, {"en": "As a non-sequential model that processes text in parallel.", "ar": "موديل غير تسلسلي بيعالج النص بالتوازي."}], "correct": 1, "ar": "وحدة جي آر يو بتتوصف إزاي مقارنةً بإل إس تي إم؟"}, {"n": 25, "en": "In the analogy presented in Lecture 2, how do LSTMs differ from simple RNNs?", "options": [{"en": "Simple RNNs use gates, whereas LSTMs let everything flow through unchecked.", "ar": "البسيطة بتستخدم بوابات، والتانية بتسيب كل حاجة تعدّي."}, {"en": "Simple RNNs process words in parallel, whereas LSTMs process words sequentially.", "ar": "البسيطة بتعالج بالتوازي، والتانية بالتسلسل."}, {"en": "Simple RNNs use dense vectors, whereas LSTMs use sparse vectors.", "ar": "البسيطة بتستخدم متجهات كثيفة، والتانية متجهات معظمها أصفار."}, {"en": "Simple RNNs let everything flow through, whereas LSTMs act like a smart conveyor belt with gates for selective memory.", "ar": "البسيطة بتسيب كل حاجة تعدّي، والتانية سير ذكي ببوابات لذاكرة انتقائية."}], "correct": 3, "ar": "في التشبيه، إيه الفرق بين إل إس تي إم والشبكات التكرارية البسيطة؟"}, {"n": 26, "en": "Despite solving word meaning (Embeddings) and memory (LSTMs), what major limitation remained in all sequential models?", "options": [{"en": "They could not process sentences longer than 5 words.", "ar": "مابتعالجش جمل أطول من 5 كلمات."}, {"en": "They could only work with sparse one-hot vectors.", "ar": "بتشتغل بمتجهات وان هوت بس."}, {"en": "They were inherently sequential, meaning the 100th word could not be processed until the first 99 words were processed in order.", "ar": "تسلسلية بطبيعتها، فلازم تعالج أول 99 كلمة قبل الكلمة رقم 100."}, {"en": "They required hand-crafted rules for every language task.", "ar": "بتحتاج قواعد مكتوبة يدويًا لكل مهمة."}], "correct": 2, "ar": "إيه العيب اللي فضل بعد حل معنى الكلمات والذاكرة؟"}, {"n": 27, "en": "Lecture 2 compares sequential processing (RNNs/LSTMs) to reading a book one word per second. What point does this analogy highlight regarding hardware scaling?", "options": [{"en": "Sequential computation cannot be parallelized, so adding more hardware/GPUs does not speed up training.", "ar": "الخطوات التسلسلية ماتتنفذش بالتوازي، فزيادة العتاد مش هتسرّعها عن طريق موازاة الخطوات دي."}, {"en": "Dense embeddings allow multiple readers to read the same page simultaneously.", "ar": "التمثيلات الكثيفة بتسمح لقراء كتير يقروا نفس الصفحة مع بعض."}, {"en": "Gated memory units allow skipping chapters without losing context.", "ar": "بوابات الذاكرة بتسمح بتخطّي الفصول من غير فقدان السياق."}, {"en": "One-hot encoding allows faster reading than continuous vector spaces.", "ar": "وان هوت بيسمح بقراءة أسرع من المتجهات المستمرة."}], "correct": 0, "ar": "تشبيه القراءة بكلمة كل ثانية بيوضح إيه بخصوص زيادة العتاد؟"}, {"n": 28, "en": "What paradigm shift is identified as necessary to break free from the one-word-at-a-time computational bottleneck?", "options": [{"en": "Returning to rule-based Symbolic AI expert systems", "ar": "الرجوع للأنظمة الرمزية بالقواعد."}, {"en": "Increasing the vector dimensionality of One-Hot encodings", "ar": "زيادة أبعاد وان هوت."}, {"en": "Using deeper stacks of simple RNN cells without gates", "ar": "زيادة عمق الشبكات التكرارية البسيطة من غير بوابات."}, {"en": "Moving to Parallel Processing where all words in a sequence are processed at once", "ar": "المعالجة المتوازية لكل كلمات التسلسل في نفس الوقت."}], "correct": 3, "ar": "إيه التغيير المطلوب للتخلّص من معالجة كلمة كل مرة؟"}, {"n": 29, "en": "According to the Key Takeaways slide, how do Word Embeddings assign meaning to words?", "options": [{"en": "By mapping each word to a single integer in a sparse lookup table.", "ar": "ربط كل كلمة بعدد صحيح واحد في جدول متناثر."}, {"en": "By placing words in a shared vector space where proximity equals similarity.", "ar": "وضع الكلمات في فضاء مشترك، القرب فيه بيمثّل التشابه."}, {"en": "By creating 50,000-dimensional orthogonal vectors with zero dot products.", "ar": "متجهات متعامدة من 50,000 بُعد وضرب نقطي صفري."}, {"en": "By applying deterministic C++ rules to sentence structures.", "ar": "تطبيق قواعد حتمية بسي بلس بلس على الجمل."}], "correct": 1, "ar": "إزاي تمثيلات الكلمات بتعبّر عن معناها حسب الخلاصة؟"}, {"n": 30, "en": "According to the concluding summary slide, what was the ultimate consequence of the computational bottleneck in sequential models?", "options": [{"en": "It prevented models from using continuous vector representations.", "ar": "منع استخدام تمثيلات متجهية مستمرة."}, {"en": "It forced deep learning researchers to abandon word embeddings.", "ar": "أجبر الباحثين يسيبوا تمثيلات الكلمات."}, {"en": "It prevented the massive scaling required for modern large language models.", "ar": "منع التوسّع الضخم المطلوب للنماذج اللغوية الحديثة."}, {"en": "It restricted natural language processing strictly to English texts.", "ar": "حصر معالجة اللغة في الإنجليزي بس."}], "correct": 2, "ar": "إيه نتيجة عنق الزجاجة الحسابي في الموديلات التسلسلية؟"}]}, {"id": 3, "title": "Lecture 3", "questions": [{"n": 1, "en": "What is the title of the seminal 2017 paper by Vaswani et al. that introduced the Transformer architecture?", "options": [{"en": "Deep Residual Learning for Image Recognition", "ar": "التعلّم العميق بالبواقي للتعرّف على الصور."}, {"en": "Attention Is All You Need", "ar": "الانتباه هو كل اللي محتاجه."}, {"en": "Language Models are Few-Shot Learners", "ar": "نماذج اللغة بتتعلم من أمثلة قليلة."}, {"en": "Recurrent Neural Networks for Sequence Learning", "ar": "الشبكات العصبية التكرارية لتعلّم التسلسلات."}], "correct": 1, "ar": "إيه عنوان بحث فاسواني وزمايله سنة 2017 اللي قدّم Transformer؟"}, {"n": 2, "en": "What was the primary limitation of RNNs and LSTMs that motivated the invention of the Transformer architecture?", "options": [{"en": "Their sequential nature created a computational bottleneck that prevented parallel processing on GPUs.", "ar": "تسلسلها عمل عنق زجاجة منع موازاة الخطوات ع الفرق بين الانتباه وجدول البحث التقليدي؟"}, {"n": 5, "en": "In deep learning self-attention, what three vectors are generated for each input word embedding?", "options": [{"en": "Query (Q), Key (K), and Value (V)", "ar": "الاستعلام والمفتاح والقيمة."}, {"en": "Encoder (E), Decoder (D), and Mask (M)", "ar": "المرمّز وفاكّ الترميز والقناع."}, {"en": "Hidden (H), Cell (C), and Output (O)", "ar": "الحالة المخفية والخلية والناتج."}, {"en": "Alpha (\\alpha), Beta (\\beta), and Gamma (\\gamma)", "ar": "ألفا وبيتا وجاما."}], "correct": 0, "ar": "إيه المتجهات التلاتة اللي بتتولد لكل تمثيل كلمة في الانتباه الذاتي؟"}, {"n": 6, "en": "In the Query-Key-Value framework of self-attention, what is the role of the Query vector q_i?", "options": [{"en": "It stores the final contextualized representation of the sentence.", "ar": "بيخزّن التمثيل النهائي للجملة مع السياق."}, {"en": "It acts as the input vector used to match against surrounding keys.", "ar": "متجه الإدخال اللي بيتقارن بمفاتيح الكلمات المحيطة."}, {"en": "It represents the target label used during supervised fine-tuning.", "ar": "بيمثّل التصنيف المستهدف في الضبط الخاضع للإشراف."}, {"en": "It contains the positional sine and cosine frequencies.", "ar": "بيحتوي على ترددات الجيب وجيب التمام للمواقع."}], "correct": 1, "ar": "إيه دور متجه الاستعلام في الانتباه الذاتي؟"}, {"n": 7, "en": "What does the Key vector k_i represent in the self-attention mechanism?", "options": [{"en": "The gradient update step calculated during backpropagation.", "ar": "خطوة تحديث التدرّج في الانتشار العكسي."}, {"en": "The output probability generated by the softmax activation function.", "ar": "احتمال الناتج من سوفت ماكس."}, {"en": "The context vector of surrounding words that is matched against queries.", "ar": "متجه سياق الكلمات المحيطة اللي بيتقارن بالاستعلامات."}, {"en": "The scalar scaling factor d_k used for normalization.", "ar": "معامل التحجيم العددي المستخدم للتطبيع."}], "correct": 2, "ar": "متجه المفتاح بيمثّل إيه في الانتباه الذاتي؟"}, {"n": 8, "en": "What is the role of the Value vector v_i in self-attention?", "options": [{"en": "It holds the triangular mask matrix values (0 or -\\infty).", "ar": "بيحتفظ بقيم القناع المثلثي، صفر أو سالب ما لا نهاية."}, {"en": "It contains the weight parameters of the residual connection layer.", "ar": "بيحتوي أوزان الوصلة المتبقية."}, {"en": "It determines the number of heads running in parallel.", "ar": "بيحدد عدد رؤوس الانتباه المتوازية."}, {"en": "It carries the actual content/information that gets extracted and summed using attention weights.", "ar": "بيحمل المعلومات الفعلية اللي بتتجمع باستخدام أوزان الانتباه."}], "correct": 3, "ar": "إيه دور متجه القيمة؟"}, {"n": 9, "en": "Given an input word representation a_i, how are the Query (q_i), Key (k_i), and Value (v_i) vectors computed?", "options": [{"en": "q_i = W_q a_i, k_i = W_k a_i, v_i = W_v a_i", "ar": "بنضرب تمثيل الكلمة في مصفوفة الأوزان الخاصة بكل متجه."}, {"en": "q_i = a_i + W_q, k_i = a_i + W_k, v_i = a_i + W_v", "ar": "بنجمع التمثيل مع أوزان كل متجه."}, {"en": "q_i = ReLU(a_i), k_i = Softmax(a_i), v_i = LayerNorm(a_i)", "ar": "بنطبق ريلو للاستعلام وسوفت ماكس للمفتاح وتطبيع الطبقة للقيمة."}, {"en": "q_i = a_i/√d_k, k_i = a_i/√d_k, v_i = a_i/√d_k", "ar": "بنقسم تمثيل الكلمة على جذر بُعد المفتاح لكل المتجهات."}], "correct": 0, "ar": "إزاي بنحسب متجهات الاستعلام والمفتاح والقيمة من تمثيل الكلمة؟"}, {"n": 10, "en": "Which mathematical operation is used to measure the pairwise similarity score between a Query vector q_i and a Key vector k_j?", "options": [{"en": "Vector subtraction", "ar": "طرح المتجهات."}, {"en": "Dot product (q_i · k_j)", "ar": "الضرب النقطي بين الاستعلام والمفتاح."}, {"en": "Element-wise division", "ar": "القسمة عنصر بعنصر."}, {"en": "Cross-product matrix multiplication", "ar": "ضرب المصفوفات بالضرب الاتجاهي."}], "correct": 1, "ar": "أنهي عملية بتقيس التشابه بين متجه الاستعلام ومتجه المفتاح؟"}, {"n": 11, "en": "What is the complete mathematical formula for Scaled Dot-Product Attention in matrix form?", "options": [{"en": "Attention(Q,K,V) = ReLU(QKᵀ)V", "ar": "نطبّق ريلو على حاصل ضرب الاستعلامات في منقول المفاتيح، ونضرب في القيم."}, {"en": "Attention(Q,K,V) = (Q + K + V)/√d_k", "ar": "نجمع الاستعلامات والمفاتيح والقيم ونقسم على جذر بُعد المفتاح."}, {"en": "Attention(Q,K,V) = softmax(QKᵀ/√d_k)V", "ar": "نضرب الاستعلامات في منقول المفاتيح ونقسم على جذر بُعد المفتاح، ثم سوفت ماكس ثم الضرب في القيم."}, {"en": "Attention(Q,K,V) = LayerNorm(Q K Vᵀ)", "ar": "نطبّق تطبيع الطبقة على حاصل ضرب الاستعلامات والمفاتيح ومنقول القيم."}], "correct": 2, "ar": "إيه المعادلة الكاملة للانتباه بالضرب النقطي المُحجَّم؟"}, {"n": 12, "en": "Why are the dot products scaled by dividing by √d_k in Scaled Dot-Product Attention?", "options": [{"en": "To convert floating-point values into binary integers.", "ar": "لتحويل الفاصلة العائمة لأعداد صحيحة ثنائية."}, {"en": "To reduce the vocabulary size from 50,000 to dk.", "ar": "لتقليل حجم القاموس من 50,000 لبُعد المفتاح."}, {"en": "To force all attention weights to equal zero.", "ar": "لجعل كل أوزان الانتباه صفر."}, {"en": "To prevent large dot product values from pushing the softmax function into regions with extremely small gradients.", "ar": "لمنع القيم الكبيرة من دفع سوفت ماكس لمناطق التدرّج فيها صغير جدًا."}], "correct": 3, "ar": "ليه بنقسم الضرب النقطي على جذر بُعد المفتاح؟"}, {"n": 13, "en": "What is the purpose of applying the Softmax function to the attention scores?", "options": [{"en": "It normalizes raw attention scores into probabilities that sum to 1.", "ar": "تحويل الدرجات لاحتمالات مجموعها 1."}, {"en": "It injects non-linear activation functions into the feedforward block.", "ar": "إضافة تفعيلات غير خطية لوحدة التغذية الأمامية."}, {"en": "It computes the positional sinusoidal embeddings.", "ar": "حساب تمثيلات المواقع الجيبية."}, {"en": "It concatenates multiple attention heads into a single matrix.", "ar": "ضم رؤوس الانتباه في مصفوفة واحدة."}], "correct": 0, "ar": "إيه هدف تطبيق سوفت ماكس على درجات الانتباه؟"}, {"n": 14, "en": "How is the final contextualized representation b_i for word i derived after softmax attention weights α_(i,j) are calculated?", "options": [{"en": "By taking the maximum value among all Key vectors.", "ar": "بأكبر قيمة بين متجهات المفاتيح."}, {"en": "By computing a weighted sum of the Value vectors: b_i = Σ_j α_(i,j) v_j.", "ar": "بمجموع متجهات القيمة بعد ضرب كل واحد في وزن الانتباه بتاعه."}, {"en": "By multiplying the Query vector by the residual connection Xi-1.", "ar": "بضرب الاستعلام في الوصلة المتبقية."}, {"en": "By applying a 1D convolution over the sentence length.", "ar": "بتطبيق التفاف أحادي البُعد على طول الجملة."}], "correct": 1, "ar": "إزاي بنحسب تمثيل الكلمة النهائي بعد حساب أوزان الانتباه؟"}, {"n": 15, "en": "What is the main limitation of relying on a single self-attention head?", "options": [{"en": "It cannot process sentences with more than two words.", "ar": "مايعالجش جمل أطول من كلمتين."}, {"en": "It forces all Query and Key dimensions to be zero.", "ar": "بيجبر أبعاد الاستعلام والمفتاح تكون صفر."}, {"en": "It can only focus on one set of relationships at a time, whereas a word may need to attend to different words for different reasons (e.g., grammar vs. semantics).", "ar": "بيركز على مجموعة علاقات واحدة في المرة، مع إن الكلمة محتاجة علاقات مختلفة للنحو والمعنى."}, {"en": "It prevents the model from using GPU parallelization.", "ar": "بيمنع المعالجة المتوازية على وحدات المعالجة الرسومية."}], "correct": 2, "ar": "إيه عيب الاعتماد على رأس انتباه ذاتي واحد؟"}, {"n": 16, "en": "How does Multi-Head Attention combine the outputs of its individual attention heads (head_1, …, head_h)?", "options": [{"en": "By adding them element-wise and dividing by h.", "ar": "بجمع عنصر بعنصر والقسمة على عدد الرؤوس."}, {"en": "By selecting the head with the highest softmax score.", "ar": "باختيار الرأس صاحب أعلى درجة سوفت ماكس."}, {"en": "By calculating the dot product across all head matrices.", "ar": "بالضرب النقطي بين مصفوفات الرؤوس."}, {"en": "By concatenating the head outputs and multiplying them by a projection weight matrix W_O.", "ar": "بضم النواتج وضربها في مصفوفة أوزان الإسقاط."}], "correct": 3, "ar": "إزاي الانتباه متعدد الرؤوس بيجمع نواتج الرؤوس؟"}, {"n": 17, "en": "Why do self-attention mechanisms require Positional Encodings?", "options": [{"en": "Because self-attention treats input tokens as an unordered set and has no inherent notion of word order.", "ar": "بيتعامل مع التوكنز كمجموعة غير مرتبة ومعندوش معرفة بترتيب الكلمات بطبيعته."}, {"en": "Because self-attention cannot compute matrix multiplications without position indices.", "ar": "مايقدرش يضرب مصفوفات من غير مؤشرات مواقع."}, {"en": "Because softmax probabilities always sum to zero without positional values.", "ar": "مجموع احتمالات سوفت ماكس بيكون صفر من غير مواقع."}, {"en": "Because positional encodings replace the need for Key and Value vectors.", "ar": "ترميز المواقع بيلغي الحاجة للمفاتيح والقيم."}], "correct": 0, "ar": "ليه الانتباه الذاتي بيحتاج ترميز المواقع؟"}, {"n": 18, "en": "Which pair of sentences is cited in Lecture 3 to illustrate that self-attention without positional encoding treats different word orders identically?", "options": [{"en": "\"I am a robot\" vs \"Robot am I\"", "ar": "أنا روبوت، مقابل روبوت أنا."}, {"en": "\"The dog chased the cat\" vs \"The cat chased the dog\"", "ar": "الكلب طارد القطة، مقابل القطة طاردت الكلب."}, {"en": "\"Time flies like an arrow\" vs \"Fruit flies like a banana\"", "ar": "الوقت بيطير زي السهم، مقابل ذباب الفاكهة بيحب الموز."}, {"en": "\"Thinking machines\" vs \"Machine thinking\"", "ar": "آلات بتفكّر، مقابل تفكير الآلة."}], "correct": 1, "ar": "أنهي زوج جمل اتذكر لتوضيح أثر غياب ترميز المواقع؟"}, {"n": 19, "en": "How are sinusoidal Positional Encodings added to the Transformer model?", "options": [{"en": "They are multiplied by the Softmax output matrix.", "ar": "بتتضرب في مصفوفة ناتج سوفت ماكس."}, {"en": "They replace the word embeddings entirely.", "ar": "بتستبدل تمثيلات الكلمات بالكامل."}, {"en": "They are added directly to the input word embeddings.", "ar": "بتتجمع مباشرةً مع تمثيلات الكلمات الداخلة."}, {"en": "They are passed through a separate RNN layer before attention.", "ar": "بتعدّي بطبقة تكرارية منفصلة قبل الانتباه."}], "correct": 2, "ar": "إزاي ترميزات المواقع الجيبية بتتضاف للموديل؟"}, {"n": 20, "en": "In the sinusoidal Positional Encoding formulas PE(pos,2i) = sin(pos/10000^(2i/d_model)) and PE(pos,2i+1) = cos(pos/10000^(2i/d_model)), what does pos represent?", "options": [{"en": "The number of attention heads in the model.", "ar": "عدد رؤوس الانتباه."}, {"en": "The index of the layer in the Transformer stack.", "ar": "رقم الطبقة في مجموعة الطبقات."}, {"en": "The scaling factor √d_k.", "ar": "معامل التحجيم جذر بُعد المفتاح."}, {"en": "The position index of a token in the sentence (from 0 to max sequence length).", "ar": "مؤشر موقع التوكن في الجملة، من صفر لحد أقصى طول للتسلسل."}], "correct": 3, "ar": "في معادلتي الجيب وجيب التمام لترميز المواقع، الرمز pos بيمثّل إيه؟"}, {"n": 21, "en": "What structural limitation of self-attention is solved by adding a Feed-Forward Network (FFN) after each attention sub-layer?", "options": [{"en": "Self-attention consists only of linear weighted averages, so the FFN introduces non-linearities.", "ar": "تجميع القيم في الانتباه عبارة عن متوسطات موزونة خطيًا، والشبكة بتضيف تحويلات غير خطية."}, {"en": "Self-attention cannot process dense word vectors without an FFN.", "ar": "الانتباه مايقدرش يعالج متجهات كثيفة من غير الشبكة."}, {"en": "Self-attention cannot run on GPUs without feedforward layers.", "ar": "الانتباه مايشتغلش على وحدات معالجة رسومية من غيرها."}, {"en": "Self-attention creates vanishing gradients in residual connections.", "ar": "الانتباه بيسبب تلاشي التدرّج في الوصلات المتبقية."}], "correct": 0, "ar": "إيه القيد اللي بتعالجه إضافة شبكة تغذية أمامية بعد الانتباه؟"}, {"n": 22, "en": "What is the structure of the position-wise Feed-Forward Network (FFN) inside a Transformer block?", "options": [{"en": "A single recurrent LSTM cell with a forget gate.", "ar": "خلية ذاكرة تكرارية واحدة ببوابة نسيان."}, {"en": "Two fully connected linear layers with a ReLU activation function in between.", "ar": "طبقتين خطيتين كاملتي الاتصال وبينهم دالة ريلو."}, {"en": "Three parallel softmax layers operating across sequence length.", "ar": "تلات طبقات سوفت ماكس متوازية على طول التسلسل."}, {"en": "A convolutional block followed by max-pooling.", "ar": "بلوك التفاف وبعده تجميع بأخذ أكبر قيمة."}], "correct": 1, "ar": "إيه تركيب شبكة التغذية الأمامية لكل موقع داخل بلوك Transformer؟"}, {"n": 23, "en": "Why is Masked Multi-Head Attention necessary in the Transformer Decoder?", "options": [{"en": "To remove stop words from the input text before processing.", "ar": "لحذف الكلمات الشائعة قبل المعالجة."}, {"en": "To reduce the vector dimensionality dmodel during training.", "ar": "لتقليل بُعد الموديل أثناء التدريب."}, {"en": "To prevent the model from attending to future tokens (y_(t+1), y_(t+2)) during auto-regressive generation.", "ar": "لمنع الانتباه للتوكنز المستقبلية أثناء التوليد المعتمد على السابق."}, {"en": "To allow the decoder to bypass the encoder's outputs.", "ar": "للسماح بتجاوز مخرجات المرمّز."}], "correct": 2, "ar": "ليه الانتباه المقنّع متعدد الرؤوس ضروري في فاكّ الترميز؟"}, {"n": 24, "en": "How does the Transformer Decoder mathematically enforce masking for future positions (j > i)?", "options": [{"en": "By deleting future word vectors from the embedding lookup table.", "ar": "بحذف متجهات الكلمات المستقبلية من جدول التمثيلات."}, {"en": "By setting the scaling factor √d_k to infinity.", "ar": "بجعل معامل التحجيم جذر بُعد المفتاح يساوي ما لا نهاية."}, {"en": "By replacing all Key vectors with zero vectors.", "ar": "باستبدال كل المفاتيح بمتجهات صفرية."}, {"en": "By setting future attention scores to −∞ before softmax, resulting in zero attention weight.", "ar": "بجعل درجات المستقبل سالب ما لا نهاية قبل سوفت ماكس، فوزنها يبقى صفر."}], "correct": 3, "ar": "إزاي فاكّ الترميز بيحجب المواقع المستقبلية رياضيًا؟"}, {"n": 25, "en": "In the Transformer block, how is a Residual Connection represented mathematically for a given layer?", "options": [{"en": "X_l = X_(l−1) + Layer(X_(l−1))", "ar": "ناتج الطبقة يساوي المدخل زائد ناتج تطبيق الطبقة عليه."}, {"en": "X_l = Softmax(Layer(X_(l−1)))", "ar": "تطبيق سوفت ماكس على ناتج الطبقة."}, {"en": "X_l = X_(l−1) × Layer(X_(l−1))", "ar": "ضرب المدخل في ناتج تطبيق الطبقة عليه."}, {"en": "X_l = Layer(X_(l−1))/X_(l−1)", "ar": "قسمة ناتج الطبقة على المدخل."}], "correct": 0, "ar": "إيه المعادلة الرياضية للوصلة المتبقية في طبقة Transformer؟"}, {"n": 26, "en": "How does Layer Normalization (LN) differ from Batch Normalization (BN)?", "options": [{"en": "Layer Normalization operates on a single batch of 1000 sentences at once.", "ar": "بيشتغل على دفعة من 1000 جملة مرة واحدة."}, {"en": "Layer Normalization computes mean and variance across the feature dimensions of an individual training example (vector).", "ar": "بيحسب المتوسط والتباين عبر أبعاد الخصائص لمثال تدريب أو متجه واحد."}, {"en": "Layer Normalization eliminates the need for weight parameters \\gamma and \\beta.", "ar": "بيلغي الحاجة لمعاملي جاما وبيتا."}, {"en": "Layer Normalization is applied only at the final output layer of the model.", "ar": "بيتطبق عند طبقة الإخراج النهائية بس."}], "correct": 1, "ar": "تطبيع الطبقة بيختلف إزاي عن تطبيع الدفعة؟"}, {"n": 27, "en": "In the Cross-Attention sub-layer of a Transformer Decoder, where do the Queries (Q), Keys (K), and Values (V) originate?", "options": [{"en": "Q, K,and V all come from the Decoder's masked self-attention.", "ar": "التلاتة من الانتباه الذاتي المقنّع في فاكّ الترميز."}, {"en": "Q, K, and V all come directly from the input word embeddings.", "ar": "التلاتة مباشرةً من تمثيلات الكلمات الداخلة."}, {"en": "Q comes from the Decoder, while K and V come from the Encoder's output.", "ar": "الاستعلامات من فاكّ الترميز، والمفاتيح والقيم من ناتج المرمّز."}, {"en": "Q and K come from the Encoder, while V comes from the Decoder.", "ar": "الاستعلامات والمفاتيح من المرمّز، والقيم من فاكّ الترميز."}], "correct": 2, "ar": "في الانتباه المتقاطع، الاستعلامات والمفاتيح والقيم بييجوا منين؟"}, {"n": 28, "en": "Which model architecture uses ONLY the Transformer Encoder blocks and is pre-trained using Masked Language Modeling (MLM)?", "options": [{"en": "GPT-2", "ar": "جي بي تي 2."}, {"en": "T5", "ar": "تي 5."}, {"en": "LLaMA", "ar": "لاما."}, {"en": "BERT", "ar": "بيرت."}], "correct": 3, "ar": "أنهي موديل بيستخدم المرمّز بس وبيتدرّب بنمذجة اللغة المقنّعة؟"}, {"n": 29, "en": "Which type of Transformer model uses ONLY decoder blocks with masked self-attention and is optimized for auto-regressive text generation tasks?", "options": [{"en": "Decoder-only models (e.g., GPT, GPT-2)", "ar": "موديلات فاكّ الترميز بس، زي جي بي تي وجي بي تي 2."}, {"en": "Encoder-only models (e.g., RoBERTa)", "ar": "موديلات المرمّز بس، زي روبرتا."}, {"en": "Encoder-Decoder models (e.g., original Transformer)", "ar": "موديلات المرمّز وفاكّ الترميز، زي Transformer الأصلي."}, {"en": "Vision-only models (e.g., ResNet)", "ar": "موديلات الرؤية بس، زي ريزنت."}], "correct": 0, "ar": "أنهي نوع بيستخدم فاكّ الترميز بس مع انتباه مقنّع لتوليد النص اعتمادًا على السابق؟"}, {"n": 30, "en": "How does the Vision Transformer (ViT) adapt the Transformer Encoder for image classification tasks?", "options": [{"en": "By replacing self-attention with 2D pooling functions.", "ar": "باستبدال الانتباه بتجميع ثنائي الأبعاد."}, {"en": "By splitting an image into flattened patches (e.g., 16×16) and treating them like word tokens.", "ar": "بتقسيم الصورة لرقع زي 16×16 وتحويلها لمتجهات والتعامل معاها كتوكنز."}, {"en": "By generating next-pixel probabilities auto-regressively using masked attention.", "ar": "بتوليد احتمال البكسل التالي بالتتابع بانتباه مقنّع."}, {"en": "By converting image pixels into 50,000-dimensional sparse one-hot vectors.", "ar": "بتحويل البكسلات لمتجهات وان هوت من 50,000 بُعد."}], "correct": 1, "ar": "إزاي Transformer الرؤية بيستخدم المرمّز لتصنيف الصور؟"}]}, {"id": 4, "title": "Lecture 4", "questions": [{"n": 1, "en": "What does LLM stand for?", "options": [{"en": "Large Learning Machine", "ar": "آلة تعلّم كبيرة."}, {"en": "Large Language Model", "ar": "نموذج لغوي كبير."}, {"en": "Linear Language Model", "ar": "نموذج لغوي خطي."}, {"en": "Language Learning Method", "ar": "طريقة تعلّم اللغة."}], "correct": 1, "ar": "اختصار LLM معناه إيه؟"}, {"n": 2, "en": "According to the lecture, a language model assigns probabilities to:", "options": [{"en": "Images", "ar": "الصور."}, {"en": "Sequences of tokens", "ar": "تسلسلات التوكنز."}, {"en": "Network connections", "ar": "اتصالات الشبكة."}, {"en": "Hardware components", "ar": "مكوّنات العتاد."}], "correct": 1, "ar": "حسب المحاضرة، نموذج اللغة بيدي احتمالات لإيه؟"}, {"n": 3, "en": "Which Transformer architecture is mainly used by LLMs discussed in the lecture?", "options": [{"en": "Encoder-only", "ar": "المرمّز بس."}, {"en": "Encoder-decoder", "ar": "المرمّز وفاكّ الترميز."}, {"en": "Decoder-only", "ar": "فاكّ الترميز بس."}, {"en": "CNN-based", "ar": "معتمدة على الشبكات الالتفافية."}], "correct": 2, "ar": "أنهي معمارية مستخدمة أساسًا في النماذج اللغوية اللي في المحاضرة؟"}, {"n": 4, "en": "Which of the following is an example of an Encoder-only model?", "options": [{"en": "GPT", "ar": "جي بي تي."}, {"en": "BERT", "ar": "بيرت."}, {"en": "T5", "ar": "تي 5."}, {"en": "LLaMA", "ar": "لاما."}], "correct": 1, "ar": "أنهي مثال لموديل بيستخدم المرمّز بس؟"}, {"n": 5, "en": "What is the main purpose of adding positional embeddings to token embeddings?", "options": [{"en": "To remove tokens", "ar": "حذف التوكنز."}, {"en": "To represent token positions", "ar": "تمثيل مواقع التوكنز."}, {"en": "To translate the sentence", "ar": "ترجمة الجملة."}, {"en": "To reduce the vocabulary size", "ar": "تقليل حجم القاموس."}], "correct": 1, "ar": "إيه هدف إضافة تمثيلات المواقع لتمثيلات التوكنز؟"}, {"n": 6, "en": "In the attention mechanism, what do Q, K, and V represent?", "options": [{"en": "Query, Key, Value", "ar": "الاستعلام والمفتاح والقيمة."}, {"en": "Quality, Knowledge, Vector", "ar": "الجودة والمعرفة والمتجه."}, {"en": "Query, Knowledge, Variable", "ar": "الاستعلام والمعرفة والمتغير."}, {"en": "Question, Key, Vector", "ar": "السؤال والمفتاح والمتجه."}], "correct": 0, "ar": "الحروف Q وK وV بتمثّل إيه؟"}, {"n": 7, "en": "What does MoE stand for?", "options": [{"en": "Model of Encoding", "ar": "نموذج الترميز."}, {"en": "Mixture of Experts", "ar": "مزيج الخبراء."}, {"en": "Multiple Output Encoder", "ar": "مرمّز متعدد المخرجات."}, {"en": "Machine of Evaluation", "ar": "آلة التقييم."}], "correct": 1, "ar": "اختصار MoE معناه إيه؟"}, {"n": 8, "en": "What is the main motivation behind using Mixture of Experts (MoE)?", "options": [{"en": "All model weights must be activated for every token.", "ar": "كل الأوزان لازم تتفعّل لكل توكن."}, {"en": "Not all weights are useful in the forward pass.", "ar": "مش كل الأوزان مفيدة في المرور الأمامي."}, {"en": "To remove the Feed Forward Network.", "ar": "إزالة شبكة التغذية الأمامية."}, {"en": "To eliminate the need for training data.", "ar": "إلغاء الحاجة لبيانات التدريب."}], "correct": 1, "ar": "إيه الدافع الأساسي لاستخدام مزيج الخبراء؟"}, {"n": 9, "en": "In an MoE architecture, what is the role of the Router (G)?", "options": [{"en": "To generate training data", "ar": "توليد بيانات التدريب."}, {"en": "To select the experts for each token", "ar": "اختيار الخبراء لكل توكن."}, {"en": "To remove the attention layer", "ar": "إزالة طبقة الانتباه."}, {"en": "To convert tokens into images", "ar": "تحويل التوكنز لصور."}], "correct": 1, "ar": "إيه دور الموجّه في مزيج الخبراء؟"}, {"n": 10, "en": "In a Dense MoE, the output is calculated using:", "options": [{"en": "Only one expert", "ar": "خبير واحد بس."}, {"en": "A weighted average of all expert outputs", "ar": "متوسط موزون لنواتج كل الخبراء."}, {"en": "Randomly selected tokens", "ar": "توكنز عشوائية."}, {"en": "The first expert only", "ar": "أول خبير بس."}], "correct": 1, "ar": "في مزيج الخبراء الكثيف، الناتج بيتحسب بإيه؟"}, {"n": 11, "en": "What is the main characteristic of Sparse MoE?", "options": [{"en": "All experts are always activated.", "ar": "كل الخبراء بيتفعّلوا دايمًا."}, {"en": "Only selected experts are activated.", "ar": "الخبراء المختارين بس هم اللي بيتفعّلوا."}, {"en": "The model does not use a router.", "ar": "الموديل مابيستخدمش موجّه."}, {"en": "It removes the Feed Forward Network.", "ar": "بيزيل شبكة التغذية الأمامية."}], "correct": 1, "ar": "إيه الصفة الأساسية لمزيج الخبراء المتناثر؟"}, {"n": 12, "en": "In MoE-based Transformer models, routing is performed for:", "options": [{"en": "Each sentence", "ar": "لكل جملة."}, {"en": "Each document", "ar": "لكل مستند."}, {"en": "Each token", "ar": "لكل توكن."}, {"en": "Each dataset", "ar": "لكل مجموعة بيانات."}], "correct": 2, "ar": "في Transformer المعتمد على مزيج الخبراء، التوجيه بيتعمل لكل إيه؟"}, {"n": 13, "en": "What is Routing Collapse?", "options": [{"en": "All experts receive equal numbers of tokens.", "ar": "كل الخبراء بياخدوا أعداد توكنز متساوية."}, {"en": "The same expert gets selected most of the time.", "ar": "نفس الخبير بيتختار معظم الوقت."}, {"en": "The model stops generating tokens.", "ar": "الموديل بيبطّل يولّد توكنز."}, {"en": "The router is removed from the model.", "ar": "الموجّه بيتشال من الموديل."}], "correct": 1, "ar": "يعني إيه انهيار التوجيه؟"}, {"n": 14, "en": "What is the purpose of using an Auxiliary Loss in MoE training?", "options": [{"en": "To make all tokens identical", "ar": "جعل كل التوكنز متطابقة."}, {"en": "To encourage other experts to participate", "ar": "تشجيع باقي الخبراء يشاركوا."}, {"en": "To remove the router", "ar": "إزالة الموجّه."}, {"en": "To reduce the vocabulary size", "ar": "تقليل حجم القاموس."}], "correct": 1, "ar": "إيه هدف الخسارة المساعدة في تدريب مزيج الخبراء؟"}, {"n": 15, "en": "What is the main idea of Next Token Prediction?", "options": [{"en": "Predicting the first word only", "ar": "توقّع أول [{"en": "Instagram and Facebook.", "ar": "إنستجرام وفيسبوك."}, {"en": "GitHub and StackOverflow.", "ar": "جيت هاب وستاك أوفرفلو."}, {"en": "Wikipedia and YouTube.", "ar": "ويكيبيديا ويوتيوب."}, {"en": "Google Maps and Gmail.", "ar": "خرائط جوجل وجيميل."}], "correct": 1, "ar": "أنهي منصات مصادر لبيانات الكود في التدريب المسبق؟"}, {"n": 19, "en": "Approximately how large can the pretraining dataset be for modern LLMs according to the lecture?", "options": [{"en": "Hundreds of tokens.", "ar": "مئات التوكنز."}, {"en": "Thousands of tokens.", "ar": "آلاف التوكنز."}, {"en": "Millions of tokens.", "ar": "ملايين التوكنز."}, {"en": "Trillions of tokens.", "ar": "تريليونات التوكنز."}], "correct": 3, "ar": "حجم بيانات التدريب المسبق للنماذج الحديثة ممكن يوصل لإيه؟"}, {"n": 20, "en": "What does FLOPs stand for?", "options": [{"en": "Floating-point Operations.", "ar": "عمليات الفاصلة العائمة."}, {"en": "Fast Learning Operations.", "ar": "عمليات التعلّم السريع."}, {"en": "Floating Language Outputs.", "ar": "مخرجات اللغة العائمة."}, {"en": "Forward Learning Parameters.", "ar": "معاملات التعلّم الأمامي."}], "correct": 0, "ar": "اختصار FLOPs معناه إيه؟"}, {"n": 21, "en": "What is the difference between FLOPs and FLOPS?", "options": [{"en": "Both measure exactly the same thing.", "ar": "الاتنين بيقيسوا نفس الحاجة بالضبط."}, {"en": "FLOPs measures operations, while FLOPS measures operations per second.", "ar": "الأول عدد العمليات، والتاني عدد العمليات في الثانية."}, {"en": "FLOPs measures memory, while FLOPS measures storage.", "ar": "الأول الذاكرة، والتاني التخزين."}, {"en": "FLOPs measures tokens, while FLOPS measures parameters.", "ar": "الأول التوكنز، والتاني المعاملات."}], "correct": 1, "ar": "إيه الفرق بين FLOPs وFLOPS؟"}, {"n": 22, "en": "According to the lecture, training FLOPs depend on which two factors?", "options": [{"en": "Number of GPUs and electricity.", "ar": "عدد وحدات المعالجة الرسومية والكهرباء."}, {"en": "Number of tokens and number of parameters.", "ar": "عدد التوكنز وعدد المعاملات."}, {"en": "Number of layers and number of users only.", "ar": "عدد الطبقات والمستخدمين بس."}, {"en": "Vocabulary size and output length only.", "ar": "حجم القاموس وطول الناتج بس."}], "correct": 1, "ar": "عدد عمليات التدريب بيعتمد على أنهي عاملين؟"}, {"n": 23, "en": "According to the sample efficiency discussion, what can bigger models achieve with the same number of tokens?", "options": [{"en": "Higher loss.", "ar": "خسارة أعلى."}, {"en": "Lower loss.", "ar": "خسارة أقل."}, {"en": "No change in performance.", "ar": "نفس الأداء من غير تغيير."}, {"en": "Zero training cost.", "ar": "تكلفة تدريب صفر."}], "correct": 1, "ar": "الموديلات الأكبر تقدر تحقق إيه بنفس عدد التوكنز؟"}, {"n": 24, "en": "What is the main idea of the Chinchilla Law?", "options": [{"en": "Training should use only a small number of tokens.", "ar": "التدريب يستخدم عدد قليل من التوكنز بس."}, {"en": "Model size is the only important factor in training.", "ar": "حجم الموديل هو العامل المهم الوحيد."}, {"en": "Model parameters and training tokens should be balanced.", "ar": "موازنة عدد معاملات الموديل مع عدد توكنز التدريب."}, {"en": "Larger models do not need training data.", "ar": "الموديلات الأكبر مش محتاجة بيانات تدريب."}], "correct": 2, "ar": "إيه الفكرة الأساسية لقانون تشينشيلا؟"}, {"n": 25, "en": "According to the Chinchilla example, approximately how many training tokens per parameter are optimal?", "options": [{"en": "2 tokens.", "ar": "توكنين."}, {"en": "10 tokens.", "ar": "10 توكنز."}, {"en": "20 tokens.", "ar": "20 توكن."}, {"en": "100 tokens.", "ar": "100 توكن."}], "correct": 2, "ar": "حسب مثال تشينشيلا، كام توكن تدريب لكل معامل هو العدد الأمثل تقريبًا؟"}, {"n": 26, "en": "According to the lecture, what is the approximate formula for training compute?", "options": [{"en": "C = N + D", "ar": "عدد المعاملات زائد عدد التوكنز."}, {"en": "C = 6ND", "ar": "6 × عدد المعاملات × عدد توكنز التدريب."}, {"en": "C = N/D", "ar": "عدد المعاملات مقسوم على عدد التوكنز."}, {"en": "C = 2N + D", "ar": "ضعف عدد المعاملات زائد عدد التوكنز."}], "correct": 1, "ar": "إيه المعادلة التقريبية لحوسبة التدريب؟"}, {"n": 27, "en": "Which of the following is considered a major challenge of pretraining LLMs?", "options": [{"en": "Very low computational requirements.", "ar": "متطلبات حوسبة قليلة جدًا."}, {"en": "High cost and long training time.", "ar": "التكلفة العالية ووقت التدريب الطويل."}, {"en": "No need for electricity.", "ar": "عدم الحاجة لكهرباء."}, {"en": "Small training datasets only.", "ar": "بيانات تدريب صغيرة بس."}], "correct": 1, "ar": "إيه أحد التحديات الكبيرة في التدريب المسبق؟"}, {"n": 28, "en": "What does the term \"Knowledge Cutoff\" refer to?", "options": [{"en": "The model cannot generate long sentences.", "ar": "الموديل مايقدرش يولّد جمل طويلة."}, {"en": "The model's learned knowledge does not automatically include information beyond a certain point in time.", "ar": "المعرفة المتعلَّمة مابتشملش تلقائيًا معلومات بعد تاريخ معيّن."}, {"en": "The model cannot understand programming languages.", "ar": "الموديل مابيفهمش لغات برمجة."}, {"en": "The model stops predicting tokens after training.", "ar": "الموديل بيبطّل يتوقّع توكنز بعد التدريب."}], "correct": 1, "ar": "الحدّ الزمني للمعرفة معناه إيه؟"}, {"n": 29, "en": "According to the lecture, which of the following is a challenge related to learned knowledge?", "options": [{"en": "Knowledge is always easy to edit.", "ar": "تعديل المعرفة دايمًا سهل."}, {"en": "The model never produces copied content.", "ar": "الموديل عمره ما بيطلع محتوى منسوخ."}, {"en": "Learned knowledge can be difficult to edit.", "ar": "تعديل المعرفة المتعلَّمة ممكن يكون صعب."}, {"en": "The model does not store any learned patterns.", "ar": "الموديل مابيخزّنش أي أنماط متعلَّمة."}], "correct": 2, "ar": "أنهي تحدّي مرتبط بالمعرفة المتعلَّمة؟"}, {"n": 30, "en": "In the pretrained model behavior example, when asked whether a teddy bear can be put in the washing machine, what type of response does the pretrained model initially provide?", "options": [{"en": "A direct recommendation to hand wash it.", "ar": "نصيحة مباشرة بالغسيل بالإيد."}, {"en": "A description of the materials commonly used to make teddy bears.", "ar": "وصف للخامات الشائع استخدامها في صناعة الدباديب."}, {"en": "A list of three washing instructions.", "ar": "قائمة بتلات تعليمات للغسيل."}, {"en": "A refusal to answer the question.", "ar": "رفض الإجابة."}], "correct": 1, "ar": "لما اتسأل الموديل المتدرّب مسبقًا عن وضع دبدوب في الغسالة، ردّ بإيه في الأول؟"}]}]</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('quizData').textContent);
const titles=['من الذكاء الرمزي للنماذج اللغوية','تمثيل الكلمات والشبكات التكرارية','Transformer وآلية الانتباه','النماذج اللغوية وتوليد النص','التدريب المسبق وقوانين التوسّع'];
const key='llm-bilingual-146-v1';
let state={};let current=0;let index=0;
const $=id=>document.getElementById(id);
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))state=saved;}catch(e){state={};}
function answersFor(l){if(!state[l.id]||typeof state[l.id]!=='object'||Array.isArray(state[l.id]))state[l.id]={};return state[l.id];}
for(const l of data){const a=answersFor(l);for(const n of Object.keys(a)){if(!l.questions.some(q=>String(q.n)===n)||!Number.isInteger(a[n])||a[n]<0||a[n]>3)delete a[n];}}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){$('storageNote').textContent='بيشتغل من غير إنترنت · الحفظ التلقائي غير متاح في المتصفح ده';}}
function stats(l){const a=answersFor(l);return {done:Object.keys(a).length,correct:l.questions.filter(q=>a[q.n]===q.correct).length};}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function home(){ $('home').classList.remove('hidden');$('quiz').classList.add('hidden');const box=$('lectures');box.replaceChildren();data.forEach((l,i)=>{const s=stats(l);const b=el('button','lecture');const top=el('div','lecture-top');top.append(el('span','badge','0'+l.id),el('span','count',l.questions.length+' سؤال'));b.append(top,el('h3','', 'المحاضرة '+l.id),el('p','',titles[i]+(l.id===5?' · لحد سلايد 31':'')));const bar=el('div','bar');const fill=el('i');fill.style.width=s.done/l.questions.length*100+'%';bar.append(fill);const foot=el('div','card-foot');foot.append(el('span','meta',s.done+' محلول · '+s.correct+' صح'),el('span','go',s.done?'كمّل المراجعة ←':'ابدأ الحل ←'));b.append(bar,foot);b.onclick=()=>openLecture(i);box.append(b);});}
function openLecture(i){current=i;const l=data[i];const a=answersFor(l);index=l.questions.findIndex(q=>a[q.n]===undefined);if(index<0)index=0;$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){const l=data[current],q=l.questions[index],a=answersFor(l),selected=a[q.n],s=stats(l);$('lectureLabel').textContent=l.title+(l.id===5?' · حتى سلايد 31':'');$('lectureTitle').textContent=titles[current];$('answered').textContent='محلول '+s.done+' / '+l.questions.length;$('score').textContent='صح '+s.correct;$('remaining').textContent='متبقي '+(l.questions.length-s.done);$('progress').style.width=s.done/l.questions.length*100+'%';$('qnumber').textContent='السؤال '+(index+1)+' من '+l.questions.length+' · رقم '+q.n+' في الملف';$('qen').textContent=q.en;$('qar').textContent=q.ar;
const box=$('options');box.replaceChildren();q.options.forEach((o,i)=>{const b=el('button','option');b.setAttribute('aria-label',String.fromCharCode(65+i)+'. '+o.en+' — '+o.ar);const content=el('div');const en=el('div','en oen',o.en);en.lang='en';content.append(en,el('div','ar oar',o.ar));const mark=el('span','mark','');b.append(el('span','letter',String.fromCharCode(65+i)),content,mark);if(selected!==undefined){b.disabled=true;if(i===q.correct){b.classList.add('correct');mark.textContent='✓';}else if(i===selected){b.classList.add('wrong');mark.textContent='✕';}}b.onclick=()=>{if(a[q.n]!==undefined)return;a[q.n]=i;save();render();};box.append(b);});
const feedback=$('feedback');feedback.replaceChildren();feedback.className='feedback'+(selected===undefined?' hidden':selected===q.correct?'':' bad');if(selected!==undefined){feedback.append(el('strong','',selected===q.correct?'✓ إجابة صحيحة':'✕ إجابة غلط — الإجابة الصح '+String.fromCharCode(65+q.correct)));if(selected!==q.correct){feedback.append(el('div','en',q.options[q.correct].en),el('div','ar',q.options[q.correct].ar));}}
$('prev').disabled=index===0;$('next').disabled=index===l.questions.length-1;$('numbers').replaceChildren();l.questions.forEach((x,i)=>{const value=a[x.n];const n=el('button','num'+(value===undefined?'':value===x.correct?' good':' bad')+(i===index?' active':''),String(x.n));n.setAttribute('aria-label','السؤال '+x.n+(value===undefined?'':value===x.correct?'، إجابة صحيحة':'، إجابة خاطئة'));if(i===index)n.setAttribute('aria-current','true');n.onclick=()=>{index=i;render();};$('numbers').append(n);});
const result=$('result');result.replaceChildren();result.classList.toggle('hidden',s.done!==l.questions.length);if(s.done===l.questions.length){result.append(el('h2','','خلصت المحاضرة!'),el('strong','',s.correct+' / '+l.questions.length),el('p','','نسبتك '+Math.round(s.correct/l.questions.length*100)+'٪ · تقدر تراجع أي سؤال من الأرقام تحت.'));}}
$('homeBtn').onclick=home;$('prev').onclick=()=>{if(index>0){index--;render();}};$('next').onclick=()=>{if(index<data[current].questions.length-1){index++;render();}};$('resetBtn').onclick=()=>{if(confirm('تبدأ المحاضرة دي من الأول وتمسح إجاباتها المحفوظة؟')){state[data[current].id]={};index=0;save();render();}};
home();
</script></body></html>
